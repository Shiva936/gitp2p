[workspace]
members = [
    "cli",
    "libs/gitp2p-core",
    "libs/gitp2p-content",
    "libs/gitp2p-sync",
    "libs/gitp2p-federation",
    "libs/gitp2p-runtime",
    "libs/gitp2p-enterprise",
    "libs/gitp2p-verify",
    "libs/gitp2p-testing",
    "tests/integrations",
    "tests/benchmarks",
]
resolver = "2"

[workspace.package]
version = "7.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gitp2p-core = { path = "libs/gitp2p-core" }
gitp2p-content = { path = "libs/gitp2p-content" }
gitp2p-sync = { path = "libs/gitp2p-sync" }
gitp2p-federation = { path = "libs/gitp2p-federation" }
gitp2p-runtime = { path = "libs/gitp2p-runtime" }
gitp2p-enterprise = { path = "libs/gitp2p-enterprise" }
gitp2p-verify = { path = "libs/gitp2p-verify" }
gitp2p-testing = { path = "libs/gitp2p-testing" }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
mdns-sd = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }
