[workspace]
members = [
    "crates/gitp2p-metadata",
    "crates/gitp2p-trust",
    "crates/gitp2p-vault",
    "crates/gitp2p-sync",
    "crates/gitp2p-recovery",
    "crates/gitp2p-bundle",
    "crates/gitp2p-lineage",
    "crates/gitp2p-manifest",
    "crates/gitp2p-reconciliation",
    "crates/gitp2p-portable-vault",
    "crates/gitp2p-media",
    "crates/gitp2p-routing",
    "crates/gitp2p-relay",
    "crates/gitp2p-mesh",
    "crates/gitp2p-topology",
    "crates/gitp2p-identity",
    "crates/gitp2p-cas",
    "crates/gitp2p-dedup",
    "crates/gitp2p-delta",
    "crates/gitp2p-merkle",
    "crates/gitp2p-verify",
    "crates/gitp2p-federation",
    "crates/gitp2p-gateway",
    "crates/gitp2p-peering",
    "crates/gitp2p-global-discovery",
    "crates/gitp2p-mobility",
    "crates/gitp2p-cli",
]
resolver = "2"

[workspace.package]
version = "5.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gitp2p-metadata = { path = "crates/gitp2p-metadata" }
gitp2p-trust = { path = "crates/gitp2p-trust" }
gitp2p-vault = { path = "crates/gitp2p-vault" }
gitp2p-sync = { path = "crates/gitp2p-sync" }
gitp2p-recovery = { path = "crates/gitp2p-recovery" }
gitp2p-bundle = { path = "crates/gitp2p-bundle" }
gitp2p-lineage = { path = "crates/gitp2p-lineage" }
gitp2p-manifest = { path = "crates/gitp2p-manifest" }
gitp2p-reconciliation = { path = "crates/gitp2p-reconciliation" }
gitp2p-portable-vault = { path = "crates/gitp2p-portable-vault" }
gitp2p-media = { path = "crates/gitp2p-media" }
gitp2p-routing = { path = "crates/gitp2p-routing" }
gitp2p-relay = { path = "crates/gitp2p-relay" }
gitp2p-mesh = { path = "crates/gitp2p-mesh" }
gitp2p-topology = { path = "crates/gitp2p-topology" }
gitp2p-identity = { path = "crates/gitp2p-identity" }
gitp2p-cas = { path = "crates/gitp2p-cas" }
gitp2p-dedup = { path = "crates/gitp2p-dedup" }
gitp2p-delta = { path = "crates/gitp2p-delta" }
gitp2p-merkle = { path = "crates/gitp2p-merkle" }
gitp2p-verify = { path = "crates/gitp2p-verify" }
gitp2p-federation = { path = "crates/gitp2p-federation" }
gitp2p-gateway = { path = "crates/gitp2p-gateway" }
gitp2p-peering = { path = "crates/gitp2p-peering" }
gitp2p-global-discovery = { path = "crates/gitp2p-global-discovery" }
gitp2p-mobility = { path = "crates/gitp2p-mobility" }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
base64 = "0.22"
mdns-sd = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
